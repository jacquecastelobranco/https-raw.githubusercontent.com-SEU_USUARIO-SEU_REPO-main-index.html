<!-- @dsCard group="Components" name="Formulários" subtitle="Input · select · textarea · newsletter jove! club" w="1240" h="820" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>By Jove! · Formulários</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap');
:root{--offwhite:#F6F2EC;--areia:#E7DFD2;--carvao:#22272F;--ouro:#C9A66A;--mineral:#6E6A65;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Century Gothic",Arial,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--offwhite);color:var(--carvao);font-family:var(--sans);font-weight:300;padding:64px;-webkit-font-smoothing:antialiased}
.eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--mineral)}
h1.title{font-family:var(--serif);font-weight:400;font-size:2.8rem;margin:8px 0 4px}
.tag{font-size:.8rem;letter-spacing:.42em;text-transform:lowercase;color:var(--mineral)}
.rule{height:1px;background:rgba(34,39,47,.14);margin:32px 0 44px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}
label{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mineral);margin:0 0 9px}
.field{margin-bottom:26px}
.inp{width:100%;font-family:var(--sans);font-weight:300;font-size:1rem;color:var(--carvao);background:#FBF9F5;
  border:1px solid rgba(34,39,47,.16);border-radius:10px;padding:14px 16px;transition:.2s}
.inp:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(201,166,106,.18)}
.inp::placeholder{color:#a9a49b}
textarea.inp{min-height:110px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mineral) 50%),linear-gradient(135deg,var(--mineral) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat}

.newsletter{background:var(--carvao);border-radius:18px;padding:48px;color:var(--offwhite)}
.nl-eyebrow{font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ouro);display:flex;align-items:center;gap:9px}
.nl-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ouro)}
.nl-title{font-family:var(--serif);font-weight:400;font-size:2rem;margin:16px 0 10px;line-height:1.15}
.nl-copy{font-size:.92rem;color:#c9c4bb;line-height:1.7;margin-bottom:26px;max-width:90%}
.nl-form{display:flex;gap:12px}
.nl-inp{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:14px 20px;color:var(--offwhite);font-family:var(--sans);font-weight:300}
.nl-inp::placeholder{color:#8f8a82}
.nl-inp:focus{outline:none;border-color:var(--ouro)}
.nl-btn{background:var(--ouro);color:var(--carvao);border:none;border-radius:999px;padding:14px 28px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-family:var(--sans);font-weight:400}
.err{border-color:#a5584f!important}
.errmsg{font-size:.72rem;color:#a5584f;margin-top:7px}
</style>
</head>
<body>
  <div class="eyebrow">By Jove! · Components</div>
  <h1 class="title">Formulários</h1>
  <div class="tag">feita de encontros.</div>
  <div class="rule"></div>

  <div class="cols">
    <div>
      <div class="field"><label>Nome</label><input class="inp" placeholder="Como podemos te chamar"></div>
      <div class="field"><label>E-mail</label><input class="inp" value="giovana@byjove.com"></div>
      <div class="field"><label>Cidade · onde você joga</label>
        <select class="inp"><option>São Paulo</option><option>Rio de Janeiro</option><option>Florianópolis</option></select>
      </div>
      <div class="field"><label>Telefone</label><input class="inp err" value="(11) 9"><div class="errmsg">Informe um número completo.</div></div>
      <div class="field"><label>Mensagem</label><textarea class="inp" placeholder="Conte um pouco sobre você e sua rotina"></textarea></div>
    </div>

    <div class="newsletter">
      <div class="nl-eyebrow"><span class="dot"></span>jove! club</div>
      <div class="nl-title">Entre para a comunidade que começou em uma quadra.</div>
      <div class="nl-copy">Acesso antecipado às coleções, convites para encontros e histórias de mulheres que fazem parte da By Jove!.</div>
      <div class="nl-form">
        <input class="nl-inp" placeholder="Seu melhor e-mail">
        <button class="nl-btn">Quero pertencer</button>
      </div>
    </div>
  </div>
</body>
</html>
